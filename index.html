<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Translation</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #0d0d0f;
    color: #eeeeee;

    padding: 24px;

    font-family: Georgia, serif;
}

.container {
    width: 100%;
    max-width: 620px;

    padding: 42px 34px 48px;

    background: #121216;

    border: 1px solid #2b2b30;

    border-radius: 22px;

    box-shadow:
        0 18px 60px rgba(0,0,0,0.35);
}


/* عنوان */

.title {
    text-align: center;

    font-size: 12px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: #8e8e96;

    margin-bottom: 40px;
}


/* شعر */

.poem {
    font-size: 10px;

    line-height: 1.55;

    font-weight: bold;
}


/* هر خط */

.line {
    display: block;

    margin-bottom: 4px;
}


/* فاصله بین بندها */

.stanza {
    margin-bottom: 34px;
}


/* فاصله معمول */

.indent {
    padding-left: 2.8em;
}


/* فقط یک واحد فاصله */

.indent-one {
    padding-left: 1ch;
}


/* فاصله بیشتر */

.indent-more {
    padding-left: 8em;
}


/* وسط چین */

.center {
    text-align: center;
}


/* تنظیم برای موبایل */

@media (max-width: 480px) {

    .container {
        padding: 34px 24px 40px;
    }

    .poem {
        font-size: 15px;

        line-height: 1.6;
    }

    .indent-more {
        padding-left: 4.5em;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="title">
        English Translation
    </div>


    <div class="poem">


        <div class="stanza">

    <span class="line" style="transform: translateX(3ch);">
    My tears meant nothing to you
</span>

            <span class="line" style="padding-left: 10ch;">
    so you left me
</span>
            <span  class="line" style="padding-left: 3ch;">
                I believed that you would never
            </span>

            <span  class="line" style="padding-left: 10ch;">
                abandon me
            </span>

        </div>


        <div class="stanza">

            <span  class="line" style="padding-left: 2ch;">
                yet you left me and broke a heart
            </span>

            <span class="line indent" style="transform: translateX(-1ch);">
    that had loved no one but you
</span>
        </div>


        <div class="stanza">

       <div style="transform: translateY(-21px);">

<span class="line center" style="transform: translateX(-1ch);">
    O miserly one
</span>
 <span class="line indent" style="transform: translateX(-1ch);">
    so sparing with your affection
</span>

<span class="line" style="transform: translateX(5ch);">
    your coldness has slain me
</span>

</div>

    </div>


</div>


</body>
</html>
